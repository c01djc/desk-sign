<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桌签生成器</title>
  <meta name="description" content="把一份名单做成可对折的 A4 桌签。一次生成所有人的，并按夹子大小调整虚线，确定对折的位置。">
  <style>
    :root {
      --bg: #f6f3ed;
      --ink: #1c1916;
      --muted: #5c564f;
      --line: #e5dcd0;
      --stage: #e3d9c8;
      --green: #1e3a34;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      color: var(--ink);
      background: var(--bg);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .wrap {
      width: min(1080px, calc(100% - 80px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 84px;
    }

    .brand {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.22em;
    }

    .btn {
      color: #f6f1e8;
      background: var(--green);
      text-decoration: none;
      font-size: 14px;
      padding: 9px 18px;
      border-radius: 999px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: center;
      padding: 28px 0 72px;
    }

    h1 {
      margin: 0;
      font-family: SimSun, "Songti SC", "Noto Serif SC", serif;
      font-size: 60px;
      font-weight: 400;
      line-height: 1.22;
      letter-spacing: 0.03em;
    }

    .copy p {
      margin: 20px 0 0;
      max-width: 24em;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.9;
    }

    .stage {
      margin: 0;
      background: var(--stage);
      border-radius: 20px;
      overflow: hidden;
    }

    .stage img,
    .frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    .label {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.18em;
    }

    .frame {
      padding: 10px;
      background: #fffdfb;
      border-radius: 16px;
      box-shadow: 0 16px 44px rgba(55, 40, 18, 0.08);
    }

    .frame img { border-radius: 8px; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding: 22px 0 32px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    footer a { color: inherit; }

    @media (max-width: 800px) {
      .wrap { width: calc(100% - 36px); }
      header { height: auto; padding: 22px 0; }
      .hero { grid-template-columns: 1fr; gap: 28px; padding: 8px 0 40px; }
      h1 { font-size: 40px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="brand">桌签生成器</p>
      <a class="btn" href="https://github.com/c01djc/desk-sign/releases/download/v1.0/桌签生成器.exe">下载</a>
    </header>

    <section class="hero">
      <div class="copy">
        <h1>一次生成<br>所有人的桌签</h1>
        <p>以前在 Word 里给每个人单独改。现在一份名单，就能做成可对折的 A4。</p>
        <p>桌签夹有大有小。调整虚线的位置，就确定了对折的地方。</p>
      </div>
      <figure class="stage">
        <img src="docs/sign.png" alt="立体预览中的粉色桌签">
      </figure>
    </section>

    <section>
      <p class="label">工具</p>
      <div class="frame">
        <img src="docs/app.png" alt="桌签生成器窗口">
      </div>
    </section>

    <footer>
      <span>版本 1.0 · 64 位 Windows · 一个程序</span>
      <a href="https://github.com/c01djc/desk-sign">github.com/c01djc/desk-sign</a>
    </footer>
  </div>
</body>
</html>
