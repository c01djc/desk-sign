<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桌签生成器</title>
  <meta name="description" content="把一份名单做成可对折的 A4 桌签。一次生成所有人的，并按夹子大小调整虚线，确定对折的位置。">
  <style>
    :root {
      --bg: #f3eee6;
      --ink: #1a1714;
      --muted: #5e564e;
      --line: #ddd4c6;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      color: var(--ink);
      background: var(--bg);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .wrap {
      width: min(1240px, calc(100% - 96px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 32px 0 0;
    }

    .name {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.22em;
    }

    .dl {
      color: var(--ink);
      font-size: 15px;
      letter-spacing: 0.08em;
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 2px;
    }

    h1 {
      margin: 88px 0 0;
      max-width: 9em;
      font-family: SimSun, "Songti SC", "Noto Serif SC", serif;
      font-size: clamp(56px, 7vw, 104px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: 0.04em;
    }

    .lead {
      margin: 36px 0 0;
      max-width: 22em;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.85;
    }

    .shots {
      display: grid;
      grid-template-columns: 1.45fr 0.72fr;
      gap: 36px;
      align-items: start;
      margin: 80px 0 0;
    }

    figure { margin: 0; }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .tool img {
      border-radius: 8px;
      box-shadow: 0 28px 70px rgba(48, 34, 16, 0.16);
    }

    figcaption {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.28em;
    }

    .points {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      margin: 96px 0 0;
      padding-top: 40px;
      border-top: 1px solid var(--line);
    }

    .points p {
      margin: 0;
      font-family: SimSun, "Songti SC", "Noto Serif SC", serif;
      font-size: clamp(26px, 2.4vw, 34px);
      line-height: 1.55;
      letter-spacing: 0.03em;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin: 88px 0 40px;
      color: var(--muted);
      font-size: 14px;
    }

    footer a { color: inherit; }

    @media (max-width: 860px) {
      .wrap { width: calc(100% - 40px); }
      h1 { margin-top: 48px; font-size: 36px; max-width: none; }
      .shots, .points { grid-template-columns: 1fr; gap: 36px; }
      .shots { margin-top: 48px; }
      header { align-items: flex-start; flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="name">桌签生成器</p>
      <a class="dl" href="https://github.com/c01djc/desk-sign/releases/download/v1.0/桌签生成器.exe">下载程序</a>
    </header>

    <h1>一份名单，<br>一次生成所有人的桌签。</h1>
    <p class="lead">把名单做成可对折的 A4。以前在 Word 里逐个改。夹子大小不同，就调整虚线，确定对折的位置。</p>

    <div class="shots">
      <figure class="tool">
        <img src="docs/app.png" alt="桌签生成器窗口，左侧是名单和虚线距，右侧是打印预览">
        <figcaption>工具</figcaption>
      </figure>
      <figure class="preview">
        <img src="docs/sign.png" alt="立体预览里，粉色桌签放在透明夹中">
        <figcaption>预览</figcaption>
      </figure>
    </div>

    <section class="points">
      <p>一份名单，一次生成所有人的。不用在 Word 里给每个人单独改。</p>
      <p>桌签夹有大有小。移动虚线，就定了对折的位置。</p>
    </section>

    <footer>
      <span>版本 1.0 · 64 位 Windows · 一个程序</span>
      <a href="https://github.com/c01djc/desk-sign">github.com/c01djc/desk-sign</a>
    </footer>
  </div>
</body>
</html>
